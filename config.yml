upstream: https://github.com/zephyrproject-rtos/zephyr.git
branch: main
window_hours: 72
state_dir: state
site_url: http://localhost:8000/
publish: false

# Static website generator
generator:
  engine: zensical
  strict: true
  native_search: false
  incremental: false

# Historical hardware intelligence
history_days: 90
history_batch: 250

# Track only the latest stable release
# Optional: latest_and_lts
release_tracking: latest
lts_series: []

# Release lifecycle information
release_policy:
  checked: '2026-11-26'
  series:
    '4.5': {status: 'Latest stable at policy snapshot', eol: '2027-10-28'}
    '4.4': {status: 'Stable at policy snapshot', eol: '2027-04-12'}
    '3.7': {status: 'Active LTS at policy snapshot', eol: '2029-07-27'}
    '2.7': {status: 'End of life (historical LTS)', eol: '2025-01-26'}
    '1.14': {status: 'End of life (historical LTS)', eol: '2022-01-01'}

# Upcoming hardware-related pull requests
pull_requests:
  enabled: true
  pages: 2

# Default watchlist
watchlist:
  boards:
    - '*mcxn*'
    - '*ra8p1*'
  vendors: []
  peripherals: []

# Initial visitor preferences
# Browser localStorage overrides these settings
preferences:
  requirements: [ethernet, can-fd, usb, crypto]
  selected: []
  baseline: main
  comparison_rows: all
  search: ''
  matches_only: false
  explorer_search: ''
  explorer_watched: false
  vendor: ''
  home_limit: 8
  watch_limit: 100
  theme: default
  hardware_query: ''
  hardware_kind: all
  hardware_vendor: ''
  hardware_capability: ''
  hardware_from: ''
  hardware_to: ''
  hardware_watched: false
