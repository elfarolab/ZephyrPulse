name: Extended browser and renderer tests
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Renderer and browser integration tests
        run: python tests/ci_fixture.py --extended
